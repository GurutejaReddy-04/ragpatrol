name: RAGPatrol CI & Regression Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  evaluate:
    name: Regression Gating & Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Ground-Truth Dataset Schema
        run: |
          python testset/validate_testset.py

      - name: Run Full Test Suite (86 Unit & Integration Tests)
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Execute End-to-End Dry-Run & Generality Gate
        run: |
          # Start independent stub RAG API in background
          python -m uvicorn stub_app.fake_rag_api:app --host 127.0.0.1 --port 8001 &
          sleep 2
          # Execute RAGPatrol against stub API
          python -m harness.runner --adapter stub --base-url http://127.0.0.1:8001 --stage all --cache-mode both --dry-run
